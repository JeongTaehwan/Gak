# =============================================================================
# 테스트 전용 설정. 두 가지를 보장한다.
#   1) 실제 API를 절대 부르지 않는다 (mode: replay)
#   2) 실제 DB를 건드리지 않는다 (인메모리 H2)
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:gak-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

gak:
  ai-limit:
    # 컨텍스트가 테스트 클래스 간에 공유돼 카운터가 누적된다 — 한도 동작 자체는
    # AiRateLimiterTest 와 각 소모 지점 테스트가 전용 인스턴스로 검증한다.
    enabled: false
  api-football:
    mode: replay
    key: ""
  scoring:
    # 채점 스케줄러도 테스트 도중 제멋대로 돌면 안 된다. 테스트가 직접 호출한다.
    enabled: false
  news:
    # 스케줄러가 테스트 도중 네트워크를 타면 안 된다. 수집은 테스트가 직접 호출한다.
    enabled: false
    # 태거도 꺼 둔다 — 테스트가 모델을 부르는 일은 없어야 한다.
    classifier:
      enabled: false
    # 저장해 둔 원문(raw-*.xml)을 돌려주는 스텁이 이 url 로 파일을 고른다.
    sources:
      - key: bbc-football
        name: BBC Sport
        url: https://feeds.bbci.co.uk/sport/football/rss.xml
        tier: MEDIA
        enabled: true
      - key: guardian-manutd
        name: The Guardian
        url: https://www.theguardian.com/football/manchester-united/rss
        tier: MEDIA
        team-id: 33
        enabled: true
      - key: men-manutd
        name: Manchester Evening News
        url: https://www.manchestereveningnews.co.uk/all-about/manchester-united-fc/?service=rss
        tier: MEDIA
        team-id: 33
        enabled: true
      # 꺼진 소스 — 스위치가 실제로 동작하는지 확인하는 데 쓴다.
      - key: sky-football
        name: Sky Sports
        url: https://www.skysports.com/rss/12040
        tier: MEDIA
        enabled: false

  sync:
    # 스케줄러가 테스트 도중 제멋대로 도는 걸 막는다. 동기화는 테스트가 직접 호출한다.
    enabled: false
    daily-request-budget: 80
    max-competitions-per-run: 6
    # replay 파일이 2024 시즌이므로 고정한다(오늘 날짜에 테스트 결과가 흔들리지 않게).
    season-override: 2024
