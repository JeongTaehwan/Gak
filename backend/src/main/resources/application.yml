# =============================================================================
# Gak(각) 공통 설정 — 값을 하드코딩하지 않는다. 전부 환경변수 참조만 둔다.
# 로컬 개발용 실제 값은 application-local.yml 에 넣고(그 파일은 .gitignore 됨),
#   SPRING_PROFILES_ACTIVE=local 로 구동한다.
# 시크릿(키/비밀번호)은 이 파일에 절대 적지 않는다.
# =============================================================================

spring:
  application:
    name: gak

  datasource:
    # DATABASE_URL 은 JDBC URL 형식이어야 한다. 예: jdbc:postgresql://localhost:5432/gak
    # (배포 시 Neon 연결 문자열도 jdbc: 접두어 형태로 넣는다.)
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 개발 편의를 위한 기본값. 스키마를 손으로 만들 필요 없이 엔티티에서 생성된다.
      # 운영/공유 DB에서는 마이그레이션 도구로 전환하고 validate 로 낮춘다(다음 단계).
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# 외부 API / 앱 전용 설정 — 값은 환경변수로만 주입.
gak:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  api-football:
    base-url: ${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
    key: ${API_FOOTBALL_KEY:}

    # real  = 실제 호출. 호출마다 무료 티어 하루 100요청을 소모한다.
    # replay= 저장해 둔 응답 파일 재생. 요청을 전혀 쓰지 않는다.
    # 기본값이 replay 인 건 의도적이다 — 개발 중 재시작만으로 하루 예산이 사라지는 쪽이
    # 훨씬 비싼 사고라, 실 호출은 명시적으로 켠 사람만 하게 한다.
    mode: ${API_FOOTBALL_MODE:replay}

    # 응답 없는 커넥션이 스케줄러 스레드를 붙잡지 않도록.
    connect-timeout: 5s
    read-timeout: 20s

    # real 모드에서 받은 원본 응답을 떨어뜨릴 디렉터리(비우면 저장 안 함).
    # 여기를 src/test/resources/apifootball 로 두면 추가 요청 없이 replay 파일이 쌓인다.
    capture-dir: ${API_FOOTBALL_CAPTURE_DIR:}

  # 주기 동기화 정책.
  sync:
    enabled: ${SYNC_ENABLED:true}

    # 매시 10분에 깨어나, "갱신 주기가 지난 대회"만 몇 개 처리한다.
    # 하루 한 번 몰아 치지 않는 이유는 SyncScheduler 주석 참고.
    cron: "0 10 * * * *"

    # 무료 100 중 실제로 쓸 상한. 개발·수동 호출 여유를 남긴다.
    daily-request-budget: ${SYNC_DAILY_BUDGET:80}

    # 한 번 깨어날 때 처리할 대회 수 상한(순간 버스트 방지).
    max-competitions-per-run: 6

    # 대회 성격별 최소 재동기화 간격(시간).
    # 컵대회는 라운드 사이가 한 달씩 벌어져 매일 불러 봐야 같은 응답만 받는다.
    interval-hours:
      league: 24    # 리그: 매일
      hybrid: 84    # 유럽대항전(조별+녹아웃): 주 2회
      cup: 168      # 컵: 주 1회

    # 시즌 강제 지정. 무료 플랜이 최신 시즌을 막을 때
    # ("Free plans do not have access to this season") 접근 가능한 시즌으로 고정한다.
    # 비워 두면 대회별 캘린더로 자동 판정한다.
    season-override: ${SYNC_SEASON_OVERRIDE:}

  # 예측 채점. 끝난 경기의 결과로 적중 여부를 매긴다.
  scoring:
    enabled: ${SCORING_ENABLED:true}

    # 매시 30분 — 동기화(매시 10분)가 경기 결과를 채워 넣은 뒤에 돈다.
    # 외부 API를 부르지 않는 순수 DB 작업이라 요청 예산과 무관하다.
    cron: "0 30 * * * *"

  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # 비어 있으면 AI 진단이 꺼진다. 앱은 정상 기동하고 진단은 규칙 기반으로 동작한다.
    key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    # low 로 두면 사고 토큰이 0 이 되어 모델이 한 번에 훑고 답을 뱉는다 — 그때
    # 근거 없는 결론(evidence: [])이 나왔다. medium 이 근거를 먼저 모으게 한다.
    effort: medium
    # 사고(thinking) + 응답을 합친 상한이다. 짧은 문장이라도 사고 자리를 남겨야 한다.
    max-tokens: 4096
    # effort: medium 실측이 26초였다. 30초로 두면 정상 응답이 타임아웃으로 버려진다.
    # 화면은 규칙 기반 문장으로 이미 완성돼 있으므로 여기서 오래 기다려도 사용자는 안 기다린다.
    timeout: 60s
